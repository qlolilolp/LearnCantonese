<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <script src="../../components/title.js"></script>
    <link rel="icon" href="../../logo.png" type="image/png">
    <style>
        body { font-family: "Comic Sans MS", "標楷體", serif; background-color: #fffcf8; display: flex; flex-direction: column; align-items: center; padding: 40px; }
        .container { max-width: 800px; width: 100%; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .question-box { margin-bottom: 30px; padding: 20px; border-bottom: 1px solid #eee; }
        .word-pool, .answer-zone { display: flex; flex-wrap: wrap; gap: 10px; min-height: 50px; padding: 10px; border: 2px dashed #ccc; border-radius: 8px; margin: 10px 0; }
        .answer-zone { border-style: solid; border-color: #ff6b00; background: #fff9f5; }
        .word-btn { padding: 8px 15px; background: white; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; font-size: 18px; }
        .word-btn:hover { background: #f0f0f0; }
        .back-btn { background: #666; color: white; text-decoration: none; padding: 10px 20px; border-radius: 50px; display: inline-block; margin-bottom: 20px; }
        .submit-btn { background: #ff6b00; color: white; padding: 15px 30px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 18px; }
        .feedback { margin-top: 10px; font-weight: bold; }
        #result-section { display: none; text-align: center; margin-top: 30px; padding: 20px; border-top: 2px dashed #eee; }
        .view-results-btn { background: #28a745; color: white; border: none; padding: 12px 24px; border-radius: 50px; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../sentence_builder.html" class="back-btn">← 返回</a>
        <h1>🔀 重組句子測驗</h1>
        <div id="quiz-container"><p class="loading">正在加載問題…</p></div>
        <button class="submit-btn" id="check-btn" onclick="checkAll()" style="display:none;">檢查所有答案</button>

        <div id="result-section">
            <p style="font-size: 20px;">測驗結束！</p>
            <button class="view-results-btn" onclick="saveAndGo()">查看結果</button>
        </div>
    </div>

<script>
    let selectedQuestions = [];
    let userAnswers = [];
    let finalScore = 0;


    const currentLang = document.documentElement.lang;

    async function loadQuestions() {
        try {
            const response = await fetch('../../data/word_order.tsv');
            const data = await response.text();
            
            const lines = data.trim().split('\n');
            const pool = [];
            

            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split('\t');
                if (cols.length >= 4) {
                    let displayQuestion = "";
                    
                    if (currentLang === "zh-Hant") {
                        displayQuestion = cols[1]; 
                    } else if (currentLang === "zh-Hans") {
                        displayQuestion = cols[2]; 
                    } else {
                        displayQuestion = cols[0]; 
                    }

                    const ansArray = cols[3].trim().split('/');
                    pool.push({ 
                        qText: displayQuestion, 
                        ans: ansArray 
                    });
                }
            }

            selectedQuestions = pool.sort(() => 0.5 - Math.random()).slice(0, 10);
            userAnswers = selectedQuestions.map(() => []);
            
            renderQuiz();
            document.getElementById('check-btn').style.display = 'block';
        } catch (error) {
            console.error("Error loading TSV:", error);
            document.getElementById('quiz-container').innerHTML = "<p style='color:red'>載入失敗</p>";
        }
    }

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = selectedQuestions.map((item, qIdx) => {
            const shuffled = [...item.ans].sort(() => 0.5 - Math.random());
            return `
                <div class="question-box">
                    <p><strong>Q${qIdx + 1}: ${item.qText}</strong></p>
                    <div class="answer-zone" id="ans-${qIdx}"></div>
                    <div class="word-pool" id="pool-${qIdx}">
                        ${shuffled.map(w => `<button class="word-btn" onclick="addWord(${qIdx}, '${w}', this)">${w}</button>`).join('')}
                    </div>
                    <div class="feedback" id="feedback-${qIdx}"></div>
                </div>
            `;
        }).join('');
    }

        window.addWord = (qIdx, word, btn) => {
            userAnswers[qIdx].push(word);
            btn.style.display = 'none';
            const az = document.getElementById(`ans-${qIdx}`);
            const newBtn = document.createElement('button');
            newBtn.className = 'word-btn';
            newBtn.innerText = word;
            newBtn.onclick = () => {
                newBtn.remove();
                btn.style.display = 'inline-block';
                const index = userAnswers[qIdx].indexOf(word);
                if (index > -1) userAnswers[qIdx].splice(index, 1);
            };
            az.appendChild(newBtn);
        };

        window.checkAll = () => {
            let correctCount = 0;
            selectedQuestions.forEach((item, i) => {
                const isCorrect = userAnswers[i].join('') === item.ans.join('');
                if(isCorrect) correctCount++;
                const fb = document.getElementById(`feedback-${i}`);
                fb.innerText = isCorrect ? "✅ 正確!" : "❌ 錯誤|正確答案: " + item.ans.join(' ');
                fb.style.color = isCorrect ? "green" : "red";
            });

            finalScore = (correctCount / selectedQuestions.length) * 100;
            document.getElementById('result-section').style.display = 'block';
            document.getElementById('check-btn').disabled = true;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        };

        function saveAndGo() {
            let records = JSON.parse(localStorage.getItem('All_Quiz_Records')) || [];
            records.push({
                type: '重組句子測驗',
                score: finalScore,
                date: new Date().toLocaleString()
            });
            localStorage.setItem('All_Quiz_Records', JSON.stringify(records));
            window.location.href = "../results.html";
        }

        loadQuestions();
    </script>
</body>
</html>
