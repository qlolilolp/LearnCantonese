<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../../components/title.js"></script>
    <link rel="icon" href="../../logo.png" type="image/png">
    <style>
        :root { --primary-orange: #ff6b00; --bg-color: #fffcf8; }
         body { font-family: "Comic Sans MS", "標楷體", serif; background-color: var(--bg-color); display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
        .game-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; max-width: 600px; width: 90%; perspective: 1000px; }
        .card { aspect-ratio: 1/1; position: relative; cursor: pointer; transform-style: preserve-3d; transition: transform 0.5s; }
        .card.flipped, .card.matched { transform: rotateY(180deg); }
        .card.matched { opacity: 0.6; cursor: default; }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); font-size: 22px; font-weight: bold; text-align: center; padding: 10px; box-sizing: border-box; }
        .card-front { background: linear-gradient(135deg, #ff8c00, #ff4500); color: white; }
        .card-back { background: white; transform: rotateY(180deg); border: 2px solid var(--primary-orange); flex-direction: column; }
        .btn { padding: 12px 30px; font-size: 18px; border: none; border-radius: 50px; cursor: pointer; background: #333; color: white; margin: 20px 5px; }
    </style>
</head>
<body>

    <div class="game-header">
        <h1>聲音↔意思</h1>
        <p>將口語單字與正確的意思配對！</p>
        <div class="stats">
            次數: <span id="moves">0</span> | 匹配: <span id="matches">0</span>/6
        </div>
    </div>

    <div class="game-grid" id="gameGrid"></div>

    <div class="controls">
        <button class="btn" onclick="resetGame()">重新開始遊戲</button>
        <button class="btn" style="background:var(--primary-orange)" onclick="location.href='../matching_game.html'">返回</button>
    </div>

    <script>
        function speak(text) {
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-HK';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        const allWords = [
            { char: "你好", sound: "nei5 hou2", text: "你好" }, { char: "唔該", sound: "m4 goi1", text: "唔該" },
            { char: "早晨", sound: "zou2 san4", text: "早晨" }, { char: "多謝", sound: "do1 ze6", text: "多謝" },
            { char: "再見", sound: "zoi3 gin3", text: "再見" }, { char: "食飯", sound: "sik6 faan6", text: "食飯" },
            { char: "對唔住", sound: "deoi3 m4 zyu6", text: "對唔住" }, { char: "幾多錢", sound: "gei2 do1 cin2", text: "幾多錢" },
            { char: "買單", sound: "maai5 daan1", text: "買單" }, { char: "唔緊要", sound: "m4 gan2 jiu3", text: "唔緊要" },
            { char: "好食", sound: "hou2 sik6", text: "好食" }, { char: "巴士", sound: "baa1 si2", text: "巴士" },
            { char: "的士", sound: "dik1 si2", text: "的士" }, { char: "飲茶", sound: "jam2 caa4", text: "飲茶" },
            { char: "點心", sound: "dim2 sam1", text: "點心" }, { char: "香港", sound: "hoeng1 gong2", text: "香港" },
            { char: "地鐵", sound: "dei6 tit3", text: "地鐵" }, { char: "廁所", sound: "ci3 so2", text: "廁所" },
            { char: "邊度", sound: "bin1 dou6", text: "邊度" }, { char: "乜嘢", sound: "mat1 je5", text: "乜嘢" },
            { char: "知道", sound: "zi1 dou6", text: "知道" }, { char: "鍾意", sound: "zung1 ji3", text: "鍾意" },
            { char: "買嘢", sound: "maai5 je5", text: "買嘢" }, { char: "今日", sound: "gam1 jat6", text: "今日" },
            { char: "聽日", sound: "ting1 jat6", text: "聽日" }, { char: "琴日", sound: "kam4 jat6", text: "琴日" },
            { char: "醫生", sound: "ji1 sang1", text: "醫生" }, { char: "老師", sound: "lou5 si1", text: "老師" },
            { char: "學生", sound: "hok6 sang1", text: "學生" }, { char: "公司", sound: "gung1 si1", text: "公司" },
            { char: "返工", sound: "faan1 gung1", text: "返工" }, { char: "收工", sound: "sau1 gung1", text: "收工" },
            { char: "朋友", sound: "pang4 jau5", text: "朋友" }, { char: "屋企", sound: "uk1 kei2", text: "屋企" },
            { char: "靚", sound: "leng3", text: "靚" }, { char: "開心", sound: "hoi1 sam1", text: "開心" },
            { char: "辛苦", sound: "san1 fu2", text: "辛苦" }, { char: "麻煩", sound: "maa4 faan4", text: "麻煩" },
            { char: "快啲", sound: "faai3 di1", text: "快啲" }, { char: "慢啲", sound: "maan6 di1", text: "慢啲" },
            { char: "等陣", sound: "dang2 zan6", text: "等陣" }, { char: "借過", sound: "ze3 gwo3", text: "借過" },
            { char: "幾多", sound: "gei2 do1", text: "幾多" }, { char: "蘋果", sound: "ping4 gwo2", text: "蘋果" },
            { char: "麵包", sound: "min6 baau1", text: "麵包" }, { char: "咖啡", sound: "gaa3 fe1", text: "咖啡" },
            { char: "凍水", sound: "dung3 seoi2", text: "凍水" }, { char: "啤酒", sound: "be1 zau2", text: "啤酒" },
            { char: "電影", sound: "din6 jing2", text: "電影" }, { char: "睇戲", sound: "tai2 hei3", text: "睇戲" },
            { char: "行街", sound: "haang4 gaai1", text: "行街" }, { char: "熱鬧", armament: "jit6 naau6", text: "熱鬧" },
            { char: "方便", sound: "fong1 bin6", text: "方便" }, { char: "準備", sound: "zeon2 bei6", text: "準備" },
            { char: "恭喜", sound: "gung1 hei2", text: "恭喜" }, { char: "身體", sound: "san1 tai2", text: "身體" },
            { char: "健康", sound: "gin6 hong1", text: "健康" }, { char: "快樂", sound: "faai3 lok6", text: "快樂" },
            { char: "成功", sound: "sing4 gung1", text: "成功" }, { char: "明白", sound: "ming4 baak6", text: "明白" }
        ];

        let flippedCards = [];
        let matchedCount = 0;
        let moves = 0;
        let lockBoard = false;

        function initGame() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            moves = 0;
            lockBoard = false;
            document.getElementById('moves').innerText = moves;
            document.getElementById('matches').innerText = matchedCount;

            let selectedWords = [...allWords].sort(() => Math.random() - 0.5).slice(0, 6);
            let gameItems = [];
            selectedWords.forEach((item, index) => {
                gameItems.push({ type: 'char', value: item.char, pairId: index });
                gameItems.push({ type: 'sound', value: item.sound, text: item.text, pairId: index });
            });

            gameItems.sort(() => Math.random() - 0.5);

            gameItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.pairId = item.pairId;
                card.dataset.type = item.type;
                if (item.type === 'sound') card.dataset.text = item.text;

                card.innerHTML = `
                    <div class="card-face card-front">?</div>
                    <div class="card-back card-face">
                        ${item.type === 'char' ? 
                            `<span>${item.value}</span>` : 
                            `<span class="sound-icon">🔊</span><span class="pinyin-hint" style="font-size:12px">${item.value}</span>`}
                    </div>
                `;

                card.onclick = () => flipCard(card, item);
                grid.appendChild(card);
            });
        }

        function flipCard(card, item) {
            if (lockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            if (item.type === 'sound') speak(item.text);

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').innerText = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            lockBoard = true;
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.pairId === card2.dataset.pairId;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedCount++;
                    document.getElementById('matches').innerText = matchedCount;
                    flippedCards = [];
                    lockBoard = false;

                    if (matchedCount === 6) {
                        setTimeout(() => alert(`🎉 恭喜！你用了 ${moves} 次!`), 300);
                    }
                }, 1200);
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    lockBoard = false;
                }, 1200);
            }
        }

        function resetGame() { initGame(); }
        initGame();
    </script>
</body>
</html>
