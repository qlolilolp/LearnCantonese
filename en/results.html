<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <script src="../components/title.js"></script>
    <link rel="icon" href="../logo.png" type="image/png">
    <style>
        body { font-family: "Comic Sans MS", "標楷體", serif; background-color: #fffcf8; display: flex; flex-direction: column; align-items: center; padding: 40px; }
        .container { max-width: 600px; width: 100%; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .record-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .record-table th, .record-table td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        .game-type { font-weight: bold; color: #333; }
        .score { color: #ff6b00; font-weight: bold; }
        .date { font-size: 12px; color: #999; }
        .back-btn { background: #666; color: white; text-decoration: none; padding: 10px 20px; border-radius: 50px; display: inline-block; margin-top: 20px; }
        .clear-btn { background: #ff4444; color: white; border: none; padding: 10px 20px; border-radius: 50px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 My Learning Records</h1>
        <table class="record-table">
            <thead>
                <tr>
                    <th>Module</th>
                    <th>Score</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="record-body">
                </tbody>
        </table>
        <div id="no-data" style="margin-top:20px; display:none;">No records found yet.</div>
        <br>
        <button class="clear-btn" onclick="clearRecords()">Clear History</button>
        <br>
        <a href="index.html" class="back-btn">Back to Home</a>
    </div>

    <script>
        function loadRecords() {
            const records = JSON.parse(localStorage.getItem('All_Quiz_Records')) || [];
            const tbody = document.getElementById('record-body');
            const noData = document.getElementById('no-data');

            if (records.length === 0) {
                noData.style.display = 'block';
                return;
            }

            records.reverse();

            tbody.innerHTML = records.map(r => `
                <tr>
                    <td class="game-type">${r.type}</td>
                    <td class="score">${r.score} / 100</td>
                    <td class="date">${r.date}</td>
                </tr>
            `).join('');
        }

        function clearRecords() {
            if(confirm("Delete all history?")) {
                localStorage.removeItem('All_Quiz_Records');
                location.reload();
            }
        }

        loadRecords();
    </script>
</body>
</html>
